; Optional reproducible build check. Arduino IDE remains the primary workflow.
[env:cyd_stage0]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
build_flags =
  -D CORE_DEBUG_LEVEL=3
