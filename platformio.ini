; Optional reproducible build check. Arduino IDE remains the primary workflow.
[env:cyd_stage2]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  lvgl/lvgl@9.5.0
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D LV_CONF_INCLUDE_SIMPLE
  -I .
